identity:
  name: query_workbook
  author: local
  label:
    en_US: Query workbook
    zh_Hans: 查询工作簿
description:
  human:
    en_US: Run a read-only DuckDB SELECT or CTE query over an Excel or CSV file.
    zh_Hans: 对 Excel 或 CSV 文件执行只读 DuckDB SELECT 或 CTE 查询。
  llm: Run one or more read-only SQL SELECT or CTE queries separated by semicolons. Use sheet names and column names returned by get_workbook_info.
parameters:
  - name: cache_id
    type: string
    required: true
    form: llm
    human_description:
      en_US: Cache ID returned by get_workbook_info.
      zh_Hans: get_workbook_info 返回的缓存 ID。
    label:
      en_US: Cache ID
      zh_Hans: 缓存 ID
    llm_description: The cache_id returned by get_workbook_info. Do not pass the original file URL.
  - name: sql
    type: string
    required: true
    form: llm
    human_description:
      en_US: One or more read-only DuckDB SELECT or CTE queries separated by semicolons.
      zh_Hans: 一个或多个只读 DuckDB SELECT 或 CTE 查询，用分号分隔。
    label:
      en_US: SQL query
      zh_Hans: SQL 查询
    llm_description: One or more read-only DuckDB SELECT or CTE statements separated by semicolons, using the exact discovered sheet and column names.
  - name: limit
    type: number
    required: false
    human_description:
      en_US: Maximum number of rows to return.
      zh_Hans: Maximum number of rows to return.
    default: 1000
    min: 1
    max: 1000
    form: form
    label:
      en_US: Result limit
      zh_Hans: 返回行数上限
extra:
  python:
    source: tools/query_workbook.py
